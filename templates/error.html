<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Error</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .box { background: #fff; border-radius: 16px; padding: 2.5rem; max-width: 480px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h2 { font-size: 1.3rem; color: #c53030; margin-bottom: 0.75rem; }
    p  { color: #718096; font-size: 0.9rem; margin-bottom: 1.5rem; line-height: 1.6; }
    a  { display: inline-block; padding: 10px 28px; background: #3182ce; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size:2.5rem; margin-bottom:1rem;">❌</div>
    <h2>Something went wrong</h2>
    <p>{{ error }}</p>
    <a href="/">← Go Back</a>
  </div>
</body>
</html>
